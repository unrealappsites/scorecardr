<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scorecardr</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const INK = "#1B2130";
const CREAM = "#F3EEE4";
const AMBER = "#E3A23C";
const AMBER_DARK = "#C9862A";
const SLATE = "#6B7280";
const LINE = "#E4DDCC";
const SERIF = "Georgia, 'Times New Roman', serif";

function TopBar({ onOpenMenu, right }) {
  return (
    <div className="flex items-center justify-between mb-6">
      <button onClick={onOpenMenu} aria-label="Open menu" style={{ fontSize: 22, color: INK }}>☰</button>
      <span className="text-lg font-bold" style={{ fontFamily: SERIF, color: INK }}>
        scorecardr<span style={{ color: AMBER }}>.</span>
      </span>
      {right || <div style={{ width: 22 }} />}
    </div>
  );
}

function SignIn({ onSignedIn }) {
  const [tab, setTab] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  return (
    <div className="min-h-screen w-full flex justify-center" style={{ backgroundColor: CREAM }}>
      <div className="w-full max-w-sm px-6 pt-14 pb-16">
        <p className="tracking-[0.18em] text-[11px] font-medium uppercase mb-3" style={{ color: SLATE }}>Scorecardr Access</p>
        <h1 className="font-bold leading-[1.05] mb-8" style={{ fontFamily: SERIF, fontSize: "40px", color: INK }}>
          Every point,<br />on the record.
        </h1>
        <div className="flex gap-6 mb-1">
          <button onClick={() => setTab("signin")} className="font-semibold pb-2 text-base" style={{ color: tab === "signin" ? INK : SLATE }}>Sign in</button>
          <button onClick={() => setTab("create")} className="font-semibold pb-2 text-base" style={{ color: tab === "create" ? INK : SLATE }}>Create account</button>
        </div>
        <div className="h-[2px] w-full mb-8" style={{ backgroundColor: LINE }}>
          <div className="h-full transition-all" style={{ width: "50%", backgroundColor: AMBER, marginLeft: tab === "create" ? "50%" : 0 }} />
        </div>
        <label className="text-[11px] uppercase tracking-wide font-medium" style={{ color: SLATE }}>Email</label>
        <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com"
          className="w-full mt-1 mb-4 rounded-xl px-4 py-3 outline-none" style={{ backgroundColor: "#fff", border: `1px solid ${INK}`, color: INK }} />
        <label className="text-[11px] uppercase tracking-wide font-medium" style={{ color: SLATE }}>Password</label>
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="At least 6 characters"
          className="w-full mt-1 mb-6 rounded-xl px-4 py-3 outline-none" style={{ backgroundColor: "#fff", border: `1px solid ${INK}`, color: INK }} />
        <button onClick={onSignedIn} className="w-full rounded-2xl py-4 font-bold text-base mb-6" style={{ backgroundColor: AMBER, color: INK }}>
          {tab === "signin" ? "Sign in" : "Create account"} →
        </button>
        <div className="flex items-center gap-3 mb-6">
          <div className="h-px flex-1" style={{ backgroundColor: LINE }} />
          <span className="text-xs" style={{ color: SLATE }}>OR</span>
          <div className="h-px flex-1" style={{ backgroundColor: LINE }} />
        </div>
        <button onClick={onSignedIn} className="w-full rounded-2xl py-4 font-semibold text-base" style={{ border: `1px solid ${INK}`, color: INK }}>
          Continue with GitHub
        </button>
      </div>
    </div>
  );
}

function Sidebar({ open, onClose, active, onNavigate, onSignOut }) {
  if (!open) return null;
  const NAV = [
    { key: "home", label: "Home", icon: "🏠" },
    { key: "today", label: "Today", icon: "🏆" },
    { key: "games", label: "Games", icon: "🎲" },
    { key: "settings", label: "Settings", icon: "⚙" },
  ];
  return (
    <div className="fixed inset-0 z-50 flex">
      <div className="w-[280px] h-full flex flex-col px-5 pt-6" style={{ backgroundColor: INK }}>
        <div className="flex items-center justify-between mb-8">
          <div className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: AMBER }} />
          <button onClick={onClose} aria-label="Close menu" style={{ color: CREAM, fontSize: 20 }}>✕</button>
        </div>
        <p className="tracking-[0.18em] text-[11px] font-medium uppercase mb-3" style={{ color: "#8890A0" }}>My Scorecardr</p>
        <nav className="flex flex-col gap-1">
          {NAV.map(({ key, label, icon }) => {
            const isActive = active === key;
            return (
              <button key={key} onClick={() => onNavigate(key)} className="flex items-center gap-3 rounded-xl px-4 py-3 text-left font-semibold"
                style={{ backgroundColor: isActive ? AMBER : "transparent", color: isActive ? INK : CREAM }}>
                <span>{icon}</span>{label}
              </button>
            );
          })}
        </nav>
        <div className="mt-auto mb-8">
          <button onClick={onSignOut} className="font-semibold" style={{ color: CREAM }}>Sign out</button>
        </div>
      </div>
      <div className="flex-1 h-full bg-black/30" onClick={onClose} />
    </div>
  );
}

function HomeScreen({ onOpenMenu, log, round, onNewGame }) {
  return (
    <div className="min-h-screen w-full flex justify-center relative" style={{ backgroundColor: CREAM }}>
      <div className="w-full max-w-sm px-6 pt-6 pb-28">
        <TopBar onOpenMenu={onOpenMenu} />
        <div className="h-px w-full mb-6" style={{ backgroundColor: LINE }} />
        <p className="tracking-[0.18em] text-[11px] font-medium uppercase mb-1" style={{ color: SLATE }}>This Game</p>
        <h1 className="font-bold leading-tight mb-8" style={{ fontFamily: SERIF, fontSize: "30px", color: INK }}>Round history</h1>
        {log.length === 0 ? (
          <div className="rounded-2xl px-4 py-8 text-center" style={{ backgroundColor: "#FFFFFF", border: `1px dashed ${LINE}` }}>
            <p className="font-semibold mb-1" style={{ color: INK }}>No rounds logged yet</p>
            <p className="text-sm" style={{ color: SLATE }}>Head to Today and tap "Start round {round + 1}" to save round {round}'s scores here.</p>
          </div>
        ) : (
          <div className="flex flex-col gap-3">
            {[...log].reverse().map((entry) => (
              <div key={entry.round} className="rounded-2xl px-4 py-4" style={{ backgroundColor: "#FFFFFF", border: `1px solid ${LINE}` }}>
                <p className="text-[11px] uppercase tracking-wide font-semibold mb-2" style={{ color: SLATE }}>Round {entry.round}</p>
                <div className="flex flex-col gap-1">
                  {entry.scores.map((s) => (
                    <div key={s.name} className="flex items-center justify-between">
                      <span className="text-sm" style={{ color: INK }}>{s.name}</span>
                      <span className="text-sm font-bold tabular-nums" style={{ color: INK }}>{s.score}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      <button onClick={onNewGame} className="fixed bottom-8 right-6 rounded-full px-5 py-4 font-bold text-sm shadow-lg" style={{ backgroundColor: AMBER, color: INK }}>
        + New Game
      </button>
    </div>
  );
}

function TodayScreen({ onOpenMenu, players, setPlayers, round, setRound, onLogRound, gameName, setGameName }) {
  const [editingGameName, setEditingGameName] = useState(false);
  const [editingPlayerId, setEditingPlayerId] = useState(null);
  const [newPlayer, setNewPlayer] = useState("");
  const [amounts, setAmounts] = useState({});

  const leaderId = players.length
    ? players.reduce((a, b) => (b.score > (a?.score ?? -Infinity) ? b : a), null)?.id
    : null;

  function getAmount(id) {
    const n = parseInt(amounts[id], 10);
    return Number.isFinite(n) && n > 0 ? n : 1;
  }
  function adjustScore(id, sign) {
    const delta = sign * getAmount(id);
    setPlayers((ps) => ps.map((p) => (p.id === id ? { ...p, score: Math.max(0, p.score + delta) } : p)));
  }
  function renamePlayer(id, name) {
    setPlayers((ps) => ps.map((p) => (p.id === id ? { ...p, name } : p)));
  }
  function addPlayer() {
    const name = newPlayer.trim();
    if (!name) return;
    setPlayers((ps) => [...ps, { id: Date.now(), name, score: 0 }]);
    setNewPlayer("");
  }
  function removePlayer(id) {
    setPlayers((ps) => ps.filter((p) => p.id !== id));
  }
  function resetGame() {
    setRound(1);
    setPlayers((ps) => ps.map((p) => ({ ...p, score: 0 })));
  }
  function startNextRound() {
    onLogRound(round, players);
    setRound((r) => r + 1);
  }

  return (
    <div className="min-h-screen w-full flex justify-center" style={{ backgroundColor: CREAM }}>
      <div className="w-full max-w-sm px-6 pt-6 pb-16">
        <TopBar onOpenMenu={onOpenMenu} right={
          <button onClick={resetGame} className="text-[11px] uppercase tracking-wider font-medium" style={{ color: SLATE }}>↻ Reset</button>
        } />
        <div className="h-px w-full mb-6" style={{ backgroundColor: LINE }} />
        <p className="tracking-[0.18em] text-[11px] font-medium uppercase mb-1" style={{ color: SLATE }}>Round {round}</p>

        <div className="flex items-center gap-2 mb-8">
          {editingGameName ? (
            <>
              <input autoFocus value={gameName} onChange={(e) => setGameName(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && setEditingGameName(false)}
                className="flex-1 bg-transparent border-none outline-none font-bold leading-tight"
                style={{ fontFamily: SERIF, fontSize: "30px", color: INK }} />
              <button onClick={() => setEditingGameName(false)} style={{ color: AMBER_DARK }}>✓</button>
            </>
          ) : (
            <>
              <h1 className="font-bold leading-tight" style={{ fontFamily: SERIF, fontSize: "30px", color: INK }}>{gameName}</h1>
              <button onClick={() => setEditingGameName(true)} style={{ color: SLATE }}>✎</button>
            </>
          )}
        </div>

        {players.length === 0 ? (
          <div className="rounded-2xl px-4 py-8 text-center mb-6" style={{ backgroundColor: "#FFFFFF", border: `1px dashed ${LINE}` }}>
            <p className="font-semibold mb-1" style={{ color: INK }}>No players yet</p>
            <p className="text-sm" style={{ color: SLATE }}>Add everyone playing tonight below to start keeping score.</p>
          </div>
        ) : (
          <div className="flex flex-col gap-3 mb-6">
            {players.map((p) => {
              const isLeader = p.id === leaderId && p.score > 0;
              const isEditing = editingPlayerId === p.id;
              return (
                <div key={p.id} className="rounded-2xl px-4 py-4" style={{ backgroundColor: "#FFFFFF", border: isLeader ? `2px solid ${AMBER}` : `1px solid ${LINE}` }}>
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex flex-col min-w-0 flex-1 mr-2">
                      <div className="flex items-center gap-1.5 min-w-0">
                        {isLeader && <span>🏆</span>}
                        {isEditing ? (
                          <input autoFocus value={p.name} onChange={(e) => renamePlayer(p.id, e.target.value)}
                            onKeyDown={(e) => e.key === "Enter" && setEditingPlayerId(null)}
                            onBlur={() => setEditingPlayerId(null)}
                            className="font-semibold bg-transparent outline-none border-b min-w-0"
                            style={{ color: INK, fontSize: "15px", borderColor: AMBER }} />
                        ) : (
                          <button onClick={() => setEditingPlayerId(p.id)} className="font-semibold truncate text-left" style={{ color: INK, fontSize: "15px" }}>
                            {p.name}
                          </button>
                        )}
                      </div>
                      <span className="text-2xl font-bold tabular-nums" style={{ fontFamily: SERIF, color: INK }}>{p.score}</span>
                    </div>
                    <button onClick={() => removePlayer(p.id)} style={{ color: SLATE }}>✕</button>
                  </div>
                  <div className="flex items-center gap-2">
                    <input type="number" value={amounts[p.id] ?? ""} onChange={(e) => setAmounts((a) => ({ ...a, [p.id]: e.target.value }))}
                      placeholder="1" className="w-16 rounded-lg px-2 py-2 text-sm text-center outline-none"
                      style={{ border: `1px solid ${LINE}`, color: INK }} />
                    <button onClick={() => adjustScore(p.id, -1)} className="flex-1 h-9 rounded-lg text-sm font-semibold" style={{ backgroundColor: CREAM, color: INK }}>− Minus</button>
                    <button onClick={() => adjustScore(p.id, 1)} className="flex-1 h-9 rounded-lg text-sm font-semibold" style={{ backgroundColor: AMBER, color: INK }}>+ Add</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <div className="rounded-2xl px-4 py-3 flex items-center gap-2 mb-8" style={{ backgroundColor: "#FFFFFF", border: `1px solid ${LINE}` }}>
          <span style={{ color: SLATE }}>＋</span>
          <input value={newPlayer} onChange={(e) => setNewPlayer(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addPlayer()}
            placeholder="Add a player" className="flex-1 bg-transparent outline-none text-sm" style={{ color: INK }} />
          <button onClick={addPlayer} className="text-xs font-semibold uppercase tracking-wide" style={{ color: AMBER_DARK }}>Add</button>
        </div>

        <button onClick={startNextRound} disabled={players.length === 0}
          className="w-full rounded-2xl py-4 font-bold text-base"
          style={{ backgroundColor: players.length === 0 ? LINE : AMBER, color: players.length === 0 ? SLATE : INK }}>
          Start round {round + 1} →
        </button>
        <p className="text-center text-[11px] mt-4" style={{ color: SLATE }}>Type a number, then tap Add or Minus to apply it.</p>
      </div>
    </div>
  );
}

function GamesScreen({ onOpenMenu }) {
  const PAST_GAMES = [
    { name: "Catan Sunday", players: 4, date: "Aug 2" },
    { name: "Poker w/ the crew", players: 5, date: "Jul 26" },
  ];
  return (
    <div className="min-h-screen w-full flex justify-center" style={{ backgroundColor: CREAM }}>
      <div className="w-full max-w-sm px-6 pt-6 pb-16">
        <TopBar onOpenMenu={onOpenMenu} />
        <div className="h-px w-full mb-6" style={{ backgroundColor: LINE }} />
        <p className="tracking-[0.18em] text-[11px] font-medium uppercase mb-1" style={{ color: SLATE }}>Past Games</p>
        <h1 className="font-bold leading-tight mb-8" style={{ fontFamily: SERIF, fontSize: "30px", color: INK }}>Every game, kept.</h1>
        <div className="flex flex-col gap-3">
          {PAST_GAMES.map((g) => (
            <div key={g.name} className="rounded-2xl px-4 py-4 flex items-center gap-3" style={{ backgroundColor: "#FFFFFF", border: `1px solid ${LINE}` }}>
              <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{ backgroundColor: CREAM }}>🎲</div>
              <div className="flex-1 min-w-0">
                <p className="font-semibold truncate" style={{ color: INK }}>{g.name}</p>
                <p className="text-xs" style={{ color: SLATE }}>{g.players} players</p>
              </div>
              <span className="text-xs" style={{ color: SLATE }}>{g.date}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function SettingsScreen({ onOpenMenu }) {
  const rows = [
    { icon: "👤", label: "Account details" },
    { icon: "🔔", label: "Notifications" },
    { icon: "🗑", label: "Delete account" },
  ];
  return (
    <div className="min-h-screen w-full flex justify-center" style={{ backgroundColor: CREAM }}>
      <div className="w-full max-w-sm px-6 pt-6 pb-16">
        <TopBar onOpenMenu={onOpenMenu} />
        <div className="h-px w-full mb-6" style={{ backgroundColor: LINE }} />
        <p className="tracking-[0.18em] text-[11px] font-medium uppercase mb-1" style={{ color: SLATE }}>Preferences</p>
        <h1 className="font-bold leading-tight mb-8" style={{ fontFamily: SERIF, fontSize: "30px", color: INK }}>Settings</h1>
        <div className="flex flex-col gap-3">
          {rows.map(({ icon, label }) => (
            <button key={label} className="rounded-2xl px-4 py-4 flex items-center gap-3 text-left" style={{ backgroundColor: "#FFFFFF", border: `1px solid ${LINE}` }}>
              <span>{icon}</span>
              <span className="font-semibold" style={{ color: INK }}>{label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [signedIn, setSignedIn] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [screen, setScreen] = useState("home");
  const [players, setPlayers] = useState([]);
  const [round, setRound] = useState(1);
  const [log, setLog] = useState([]);
  const [gameName, setGameName] = useState("Friday Game Night");

  function logRound(roundNumber, currentPlayers) {
    setLog((l) => [...l, { round: roundNumber, scores: currentPlayers.map((p) => ({ name: p.name, score: p.score })) }]);
  }
  function newGame() {
    setPlayers([]);
    setRound(1);
    setLog([]);
    setGameName("New Game");
    setScreen("today");
  }

  if (!signedIn) return <SignIn onSignedIn={() => setSignedIn(true)} />;

  function navigate(key) {
    setScreen(key);
    setMenuOpen(false);
  }

  return (
    <>
      <Sidebar open={menuOpen} onClose={() => setMenuOpen(false)} active={screen} onNavigate={navigate} onSignOut={() => setSignedIn(false)} />
      {screen === "home" && <HomeScreen onOpenMenu={() => setMenuOpen(true)} log={log} round={round} onNewGame={newGame} />}
      {screen === "today" && (
        <TodayScreen onOpenMenu={() => setMenuOpen(true)} players={players} setPlayers={setPlayers}
          round={round} setRound={setRound} onLogRound={logRound} gameName={gameName} setGameName={setGameName} />
      )}
      {screen === "games" && <GamesScreen onOpenMenu={() => setMenuOpen(true)} />}
      {screen === "settings" && <SettingsScreen onOpenMenu={() => setMenuOpen(true)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
